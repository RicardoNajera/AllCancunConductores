<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>All Cancún · Conductores</title>
  <meta name="description" content="Panel del conductor All Cancún: viajes asignados, aceptar o rechazar y ubicación en vivo." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__dot" aria-hidden="true"></span>
        <span>All Cancún <strong>Conductores</strong></span>
      </div>
      <div class="topbar__actions">
        <span id="estado-conexion" class="pill pill--off">Sin conectar</span>
        <button id="btn-salir" class="btn-icon" type="button" hidden aria-label="Cerrar sesión">⎋</button>
      </div>
    </header>

    <main id="vista" class="vista" aria-live="polite"></main>

    <nav class="dock" id="dock" hidden>
      <button type="button" class="dock__item is-active" data-tab="viajes">
        <span class="dock__icon" aria-hidden="true">🛣️</span><span>Viajes</span>
      </button>
      <button type="button" class="dock__item" data-tab="ganancias">
        <span class="dock__icon" aria-hidden="true">💰</span><span>Ganancias</span>
      </button>
      <button type="button" class="dock__item" data-tab="perfil">
        <span class="dock__icon" aria-hidden="true">👤</span><span>Perfil</span>
      </button>
    </nav>
  </div>

  <script src="config.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
